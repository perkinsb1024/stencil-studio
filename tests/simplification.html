<!doctype html><html lang="en"><meta charset="utf-8"><title>SVG simplification checks</title>
<style>body{font:14px system-ui;margin:20px;color:#502c6c}li{margin:8px 0}.fail{color:#a00}iframe{width:1100px;height:1000px;border:1px solid #ddd}#summary{font-weight:bold}</style>
<h1>SVG simplification checks</h1><p id="summary">Running…</p><ol id="results"></ol><iframe title="Simplification editor under test" src="about:blank"></iframe>
<script type="module">
import { previewReady } from './preview-ready.js';
const frame = document.querySelector('iframe'), key = 'stencil-studio.workspace.v1:simplification-tests';
const visual = new URLSearchParams(location.search).has('visual');
localStorage.removeItem(key);
let d, w;
const $ = s => d.querySelector(s), sleep = async ms => { await new Promise(resolve => setTimeout(resolve, ms)); if (d) await previewReady(d); };
function assert(value, message = 'Unexpected result') { if (!value) throw new Error(message); }
async function check(name, action) {
  const li = document.createElement('li');
  try { await action(); li.textContent = `PASS — ${name}`; }
  catch (error) { li.textContent = `FAIL — ${name}: ${error.message}`; li.className = 'fail'; }
  document.querySelector('#results').append(li);
}
async function until(predicate) {
  for (let i = 0; i < 150; i++) { if (predicate()) return; await sleep(40); }
  throw new Error('Timed out waiting for preview');
}
async function load(action) {
  await new Promise(resolve => { frame.addEventListener('load', resolve, { once: true }); action(); });
  d = frame.contentDocument; w = frame.contentWindow; await until(() => $('#simplify-artwork')); await previewReady(d);
}
async function click(s) { $(s).click(); await sleep(30); }
async function change(s, value, event = 'change') {
  $(s).value = value; $(s).dispatchEvent(new w.Event(event, { bubbles: true })); await sleep(20);
}
async function preview() { await until(() => !$('#apply-simplify').disabled && $('#simplify-status').textContent.includes('Preview ready')); }
function flush() { w.dispatchEvent(new w.Event('stencil:before-reload')); }
function saved() { flush(); return JSON.parse(localStorage.getItem(key)); }
function cuts() { return $('.cut-shape').getAttribute('d'); }
async function upload(source, name) {
  const transfer = new w.DataTransfer(); transfer.items.add(new w.File([source], name, { type: 'image/svg+xml' }));
  $('#file-input').files = transfer.files; $('#file-input').dispatchEvent(new w.Event('change', { bubbles: true }));
  await until(() => $('#filename').textContent === name);
}
await load(() => { frame.src = '/?workspace=simplification-tests&live-reload=off'; });
const lakes = await (await fetch('/svgs/GreatLakes_nounProject.svg')).text();
let original, simplified, originalCuts, originalDimensions;
await check('Great Lakes imports and cancel leaves source and edits unchanged', async () => {
  await upload(lakes, 'GreatLakes_nounProject.svg');
  await click('#edit-outlines'); await click('#select-outline-0'); await click('#hide-outlines');
  original = saved(); originalCuts = cuts();
  originalDimensions = [$('#dimension-width').textContent, $('#dimension-height').textContent];
  await click('#simplify-artwork'); assert($('#simplify-dialog').open);
  assert($('#apply-simplify').disabled && $('#simplify-statistics').textContent.includes('Nodes'));
  await change('#simplify-tolerance', 0.12); await preview();
  await click('#cancel-simplify');
  assert(!$('#simplify-dialog').open && cuts() === originalCuts);
  assert(JSON.stringify(saved().document) === JSON.stringify(original.document));
});
await check('Sliders update node counts and show a simplified Great Lakes preview', async () => {
  await click('#simplify-artwork');
  await change('#simplify-smooth-range', 0.2, 'input');
  await change('#simplify-breakWidth-range', 0.8, 'input');
  await change('#simplify-tolerance-range', 0.12, 'input'); await preview();
  const stats = $('#simplify-statistics').textContent;
  const counts = [...stats.matchAll(/[\d,]+/g)].map(m => Number(m[0].replaceAll(',', '')));
  assert(counts[1] < counts[0], stats);
  assert($('#simplify-svg .simplify-result').getAttribute('d').length > 10);
  await click('#simplify-nodes'); assert(d.querySelectorAll('.simplify-node-markers circle').length === counts[1]);
  await click('#simplify-zoom-in'); assert($('#simplify-zoom-label').textContent === '150%');
  assert($('#simplify-stage').scrollWidth > $('#simplify-stage').clientWidth);
  await click('#simplify-fit'); assert($('#simplify-zoom-label').textContent === '100%');
  await click('#simplify-original'); assert(!$('#simplify-svg [stroke-dasharray]'));
});
await check('Download saves a plain simplified SVG at physical size without changing the workspace', async () => {
  const before = saved();
  let blob, filename;
  const create = w.URL.createObjectURL, anchorClick = w.HTMLAnchorElement.prototype.click;
  w.URL.createObjectURL = value => { blob = value; return 'blob:simplify-download-check'; };
  w.HTMLAnchorElement.prototype.click = function () { filename = this.download; };
  try { await click('#download-simplify'); }
  finally { w.URL.createObjectURL = create; w.HTMLAnchorElement.prototype.click = anchorClick; }
  assert(blob?.type === 'image/svg+xml' && filename === 'GreatLakes_nounProject-simplified.svg');
  const source = await blob.text(), xml = new w.DOMParser().parseFromString(source, 'image/svg+xml');
  assert(!xml.querySelector('parsererror') && xml.documentElement.getAttribute('width') === '150mm');
  const box = xml.documentElement.getAttribute('viewBox').split(' ').map(Number);
  assert(Math.abs(parseFloat(xml.documentElement.getAttribute('height')) / 150 - box[3] / box[2]) < 0.00001);
  assert(xml.querySelector('path[fill-rule="evenodd"]')?.getAttribute('d').length > 10);
  assert(!xml.querySelector('circle, [class], [stroke-dasharray]'), 'Preview guides appeared in the download');
  assert(source.includes('Created by Alec Dhuse'), 'Credit metadata was lost');
  const after = saved();
  assert($('#simplify-dialog').open && after.source === before.source);
  assert(JSON.stringify(after.document) === JSON.stringify(before.document) && JSON.stringify(after.history) === JSON.stringify(before.history));
});
await check('Apply replaces SVG, keeps physical size and clears previous outline edits', async () => {
  await click('#apply-simplify'); assert(!$('#simplify-dialog').open);
  simplified = saved();
  assert(simplified.source !== original.source && simplified.source.includes('data-stencil-frame'));
  assert(simplified.document.hiddenContours.length === 0 && simplified.document.regions.length === 0);
  assert(simplified.document.areaSuggestions.version === 1 && simplified.document.areaSuggestions.artworkWidth === simplified.document.settings.artworkWidth);
  assert(Object.keys(simplified.document.areaOverrides).length === 0, 'Simplification retained old manual area choices');
  assert(simplified.name === 'GreatLakes_nounProject-simplified.svg');
  assert(JSON.stringify([$('#dimension-width').textContent, $('#dimension-height').textContent]) === JSON.stringify(originalDimensions), 'Physical dimensions changed');
  assert(cuts() !== originalCuts && !$('#undo').disabled);
});
await check('Undo and redo restore the full source SVG and previous edits', async () => {
  await click('#undo');
  const restored = saved(); assert(restored.source === original.source && cuts() === originalCuts);
  assert(JSON.stringify(restored.document.areaSuggestions) === JSON.stringify(original.document.areaSuggestions), 'Undo changed original suggestions');
  assert(JSON.stringify(restored.document.areaOverrides) === JSON.stringify(original.document.areaOverrides), 'Undo lost manual area choices');
  assert(JSON.stringify(restored.document.hiddenContours) === JSON.stringify(original.document.hiddenContours));
  await click('#redo'); assert(saved().source === simplified.source);
});
await check('Replacement and both sides of its history recover after reload', async () => {
  await load(() => frame.contentWindow.location.reload());
  assert(saved().source === simplified.source);
  await click('#undo'); assert(saved().source === original.source && cuts() === originalCuts);
  await click('#redo'); assert(saved().source === simplified.source);
});
await check('Rapid updates keep the latest preview; reset disables applying', async () => {
  await click('#simplify-artwork');
  await change('#simplify-tolerance-range', 1, 'input');
  await change('#simplify-tolerance-range', 0.05, 'input'); await preview();
  assert($('#simplify-tolerance').value === '0.05');
  await click('#simplify-reset');
  assert($('#apply-simplify').disabled && $('#download-simplify').disabled && $('#simplify-stage').getAttribute('aria-busy') === 'false');
  await click('#cancel-simplify');
});
await check('All-erased preview cannot be applied', async () => {
  await upload('<svg xmlns="http://www.w3.org/2000/svg"><rect width="10" height="10"/></svg>', 'tiny.svg');
  await change('#artworkWidth', 10); await click('#simplify-artwork');
  await change('#simplify-breakWidth', 10);
  await until(() => $('#simplify-status').textContent.includes('remove all artwork'));
  assert($('#apply-simplify').disabled && $('#download-simplify').disabled); await click('#cancel-simplify');
});
await check('Open paths retain their endpoints after applying node reduction', async () => {
  await upload('<svg xmlns="http://www.w3.org/2000/svg"><path d="M0 0L25 0.01L50 0" fill="none" stroke="black"/></svg>', 'line.svg');
  await click('#simplify-artwork'); await change('#simplify-tolerance', 0.1); await preview();
  assert($('#simplify-statistics').textContent.includes('3 → 2'));
  await click('#apply-simplify'); assert(saved().source.includes('M0 0L50 0'));
});
await check('Modal fits phone width and keyboard shortcuts do not edit background', async () => {
  frame.style.width = '375px'; await click('#simplify-artwork');
  const r = $('#simplify-dialog').getBoundingClientRect();
  assert(r.left >= 0 && r.right <= w.innerWidth && $('#simplify-dialog').scrollWidth <= r.width + 1, 'Horizontal overflow');
  const before = saved().source;
  $('#cancel-simplify').dispatchEvent(new w.KeyboardEvent('keydown', { bubbles: true, key: 'z', ctrlKey: true }));
  assert(saved().source === before);
  await click('#cancel-simplify'); frame.style.width = '1100px';
});
const failures = document.querySelectorAll('.fail').length;
document.querySelector('#summary').textContent = `${document.querySelectorAll('#results li').length - failures} passed; ${failures} failed.`;
if (visual) {
  await upload(lakes, 'GreatLakes_nounProject.svg'); await change('#artworkWidth', 150); await click('#simplify-artwork');
  await change('#simplify-smooth', 0.2); await change('#simplify-breakWidth', 0.8); await change('#simplify-tolerance', 0.12); await preview();
}
</script></html>
