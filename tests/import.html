<!doctype html><html lang="en"><meta charset="utf-8"><title>SVG import checks</title><style>body{font:16px system-ui;padding:30px;color:#502c6c}li{margin:12px 0}.fail{color:#a00}</style><h1>SVG import checks</h1><ol id="results"></ol><script src="/vendor/paper-full.min.js"></script><script src="/vendor/clipper.js"></script><script type="module">
import { importSvg, scaleArtwork } from '/src/import-svg.js';
import { simplifiedSvg, simplifyArtwork } from '/src/simplify-svg.js';
const wrap = body => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">${body}</svg>`;
function check(name, action) {
  const li = document.createElement('li');
  try { action(); li.textContent = `PASS — ${name}`; }
  catch (error) { li.textContent = `FAIL — ${name}: ${error.message}`; li.className = 'fail'; }
  document.querySelector('#results').append(li);
}
function assert(value, message = 'Unexpected result') { if (!value) throw new Error(message); }
const near = (a, b) => Math.abs(a - b) < 0.05;
check('Transformed group and shape bounds', () => {
  const { bounds } = importSvg(wrap('<g transform="translate(10 20) scale(2 3)"><rect x="5" y="5" width="20" height="10"/></g>'));
  assert(near(bounds.minX,20) && near(bounds.minY,35) && near(bounds.maxX,60) && near(bounds.maxY,65), JSON.stringify(bounds));
});
check('Compound path subcontours remain separate', () => {
  const a = importSvg(wrap('<path d="M10 10H100V100H10Z M30 30H80V80H30Z"/>'));
  assert(a.contours.length === 2); assert(a.contours.every(c => c.closed));
});
check('Material regions retain inherited fill rules, drawing order and transformed compound membership', () => {
  const a = importSvg(wrap('<g fill-rule="evenodd" transform="translate(5 10)"><path id="donut" d="M10 10H100V100H10Z M30 30H80V80H30Z"/></g><rect x="120" y="10" width="10" height="10"/>'));
  assert(a.sourceRegions.length === 2);
  assert(a.sourceRegions[0].fillRule === 'evenodd');
  assert(a.sourceRegions[0].contourIds.length === 2);
  assert(a.contours[0].regionId === a.contours[1].regionId);
  assert(a.contours[2].regionId !== a.contours[0].regionId);
  const scaled = scaleArtwork(a, 150, 8);
  assert(scaled.contours[0].regionId === a.contours[0].regionId && scaled.contours[0].fillRule === 'evenodd');
});
check('Curves flatten and preserve a circular outline', () => {
  const a = importSvg(wrap('<circle cx="100" cy="100" r="40"/>'));
  assert(a.contours.length === 1 && a.contours[0].points.length > 40);
  assert(near(a.bounds.minX,60) && near(a.bounds.maxY,140));
});
check('Hidden geometry is not cut', () => {
  const a = importSvg(wrap('<rect width="20" height="20"/><g display="none"><circle cx="100" cy="100" r="40"/></g>'));
  assert(a.contours.length === 1);
});
check('SVG definitions and transformed use references', () => {
  const a = importSvg(wrap('<defs><path id="test-shape" d="M0 0H10V10H0Z"/></defs><use href="#test-shape" x="30" y="40"/>'));
  assert(a.contours.length === 1, `Contours: ${a.contours.length}`);
  assert(near(a.bounds.minX,30) && near(a.bounds.minY,40) && near(a.bounds.maxX,40), JSON.stringify(a.bounds));
});
check('Dimensions preserve aspect ratio and account for sheet margins', () => {
  const scaled = scaleArtwork(importSvg(wrap('<rect width="100" height="50"/>')), 150, 8);
  assert(scaled.width === 166 && scaled.height === 91 && scaled.artworkHeight === 75);
});
check('Live text is rejected with an actionable error', () => {
  try { importSvg(wrap('<text x="20" y="20">Test</text>')); throw new Error('Text was accepted'); }
  catch(error) { assert(error.message.includes('Convert text')); }
});
check('Clipping is rejected with an actionable error', () => {
  try { importSvg(wrap('<defs><clipPath id="clip"><rect width="10" height="10"/></clipPath></defs><rect width="100" height="100" clip-path="url(#clip)"/>')); throw new Error('Clipping was accepted'); }
  catch(error) { assert(error.message.includes('Flatten')); }
});
check('Vector artwork with text credits imports with a notice and preserves metadata', () => {
  const a = importSvg(wrap('<rect width="100" height="50"/><text y="180">Created by Artist &amp; Co</text>'));
  assert(a.contours.length === 1 && a.warnings.some(w => w.includes('Live text was skipped')));
  assert(a.description.includes('Created by Artist & Co'));
  const output = simplifiedSvg(simplifyArtwork(a, { width: 150, tolerance: 0.1 }));
  assert(output.includes('Created by Artist &amp; Co') && !output.includes('<text'));
  assert(importSvg(output).description === a.description);
});
check('Simplified artwork retains scale and position when edge islands disappear', () => {
  const source = importSvg(wrap('<rect x="20" y="30" width="50" height="30"/><rect x="90" y="30" width="1" height="1"/>'));
  const simplified = simplifyArtwork(source, { width: 71, breakWidth: 2, tolerance: 0.1 });
  const restored = importSvg(simplifiedSvg(simplified));
  assert(restored.contours.length === 1);
  assert(near(restored.bounds.maxX - restored.bounds.minX, 71));
  assert(near(restored.bounds.maxY - restored.bounds.minY, 30));
  assert(near(scaleArtwork(restored, 71, 8).height, 46));
});
check('Malformed files are rejected', () => {
  try { importSvg('<svg><path></svg>'); throw new Error('Invalid file was accepted'); }
  catch(error) { assert(error.message.includes('valid SVG')); }
});
check('Open paths are imported with a notice', () => {
  const a = importSvg(wrap('<path d="M10 10L100 100"/>'));
  assert(!a.contours[0].closed && a.warnings[0].includes('Open paths'));
});
check('Scripts and external references are never executed', () => {
  globalThis.importTestExecuted = false;
  const a = importSvg(wrap('<script>globalThis.importTestExecuted=true;<\/script><rect width="100" height="100" onload="globalThis.importTestExecuted=true"/>'));
  assert(a.contours.length === 1 && !globalThis.importTestExecuted);
});
document.body.append(`${document.querySelectorAll('li:not(.fail)').length} passed; ${document.querySelectorAll('.fail').length} failed.`);
</script></html>
