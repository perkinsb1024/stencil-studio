<!doctype html><html lang="en"><meta charset="utf-8"><title>Outline editing checks</title>
<style>body{font:14px system-ui;padding:24px;color:#502c6c}li{margin:8px 0}.fail{color:#a00}iframe{width:1100px;height:1500px;border:1px solid #ddd}#summary{font-weight:bold}</style>
<h1>Outline editing checks</h1><p id="summary">Running…</p><ol id="results"></ol><iframe title="Outline editor under test" src="about:blank"></iframe>
<script type="module">
const frame = document.querySelector('iframe'), key = 'stencil-studio.workspace.v1:outline-editing-tests';
localStorage.removeItem(key);
let d, w;
const $ = selector => d.querySelector(selector);
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
function assert(value, message = 'Unexpected result') { if (!value) throw new Error(message); }
async function check(name, action) {
  const li = document.createElement('li');
  try { await action(); li.textContent = `PASS — ${name}`; }
  catch (error) { li.textContent = `FAIL — ${name}: ${error.message}`; li.className = 'fail'; }
  document.querySelector('#results').append(li);
}
async function load(action) {
  await new Promise(resolve => { frame.addEventListener('load', resolve, { once: true }); action(); });
  d = frame.contentDocument; w = frame.contentWindow;
  if (new URLSearchParams(location.search).has('headless')) {
    w.requestAnimationFrame = callback => w.setTimeout(() => callback(w.performance.now()), 16);
    w.cancelAnimationFrame = id => w.clearTimeout(id);
  }
  await sleep(50);
}
async function click(selector, shiftKey = false) {
  $(selector).dispatchEvent(new w.MouseEvent('click', { bubbles: true, shiftKey })); await sleep(40);
}
async function change(selector, value) { $(selector).value = value; $(selector).dispatchEvent(new w.Event('change', { bubbles: true })); await sleep(40); }
const cuts = () => $('.cut-shape').getAttribute('d');
const markers = () => [...d.querySelectorAll('.tab-marker')];
const outline = id => `[data-visibility-outline="outline-${id}"]`;
const selected = () => [...d.querySelectorAll('.outline-select[aria-pressed="true"]')];
function flush() { w.dispatchEvent(new w.Event('stencil:before-reload')); }
function caretPointsTo(panelId, buttonId) {
  const panel = $(panelId), button = $(buttonId).getBoundingClientRect();
  const style = w.getComputedStyle(panel, '::before');
  const caretX = panel.getBoundingClientRect().left + parseFloat(w.getComputedStyle(panel).borderLeftWidth) + parseFloat(style.left) + parseFloat(style.width) / 2;
  assert(Math.abs(caretX - (button.left + button.width / 2)) <= 3, `Caret is not aligned to ${buttonId} at ${w.innerWidth}px: ${caretX} vs ${button.left + button.width / 2}`);
  assert(style.content !== 'none', 'Missing caret');
  assert(button.bottom <= panel.getBoundingClientRect().top, 'Mode button is below its panel');
}
await load(() => { frame.src = '/?workspace=outline-editing-tests&live-reload=off'; });
let originalCuts, dimensions, customCuts, customLayout;
await check('Outline mode has thumbnails, visible checkboxes, selection targets and an aligned caret', async () => {
  originalCuts = cuts(); dimensions = [$('#dimension-width').textContent, $('#dimension-height').textContent];
  const size = $('#preview-svg').getBoundingClientRect();
  await click('#edit-outlines');
  assert(!$('#outline-inspector').hidden && $('#tab-inspector').hidden);
  assert($('#edit-outlines').getAttribute('aria-pressed') === 'true');
  assert(d.querySelectorAll('.outline-row').length === 2 && d.querySelectorAll('.outline-select svg').length === 2);
  assert($('#visible-outline-0').checked && $('#visible-outline-1').checked);
  assert($(outline(0)).getAttribute('tabindex') === '0');
  assert(markers().length === 0 && cuts() === originalCuts);
  assert(Math.abs(size.width - $('#preview-svg').getBoundingClientRect().width) < 1, 'Editing resized artwork');
  caretPointsTo('#outline-inspector', '#edit-outlines');
});
await check('Canvas and list selections synchronize; Shift toggles multiple outlines', async () => {
  await click(outline(0)); assert(selected().length === 1 && $('#select-outline-0').getAttribute('aria-pressed') === 'true');
  await click('#select-outline-1', true); assert(selected().length === 2);
  await click(outline(0), true); assert(selected().length === 1 && $('#select-outline-1').getAttribute('aria-pressed') === 'true');
});
await check('Hiding updates cuts and guides without moving or resizing artwork', async () => {
  await click('#hide-outlines');
  assert(!$('#visible-outline-1').checked && $('#outline-count').textContent === '1 of 2 visible');
  assert($(outline(1)).classList.contains('is-hidden') && cuts() !== originalCuts);
  assert(JSON.stringify(dimensions) === JSON.stringify([$('#dimension-width').textContent, $('#dimension-height').textContent]));
  await click('#show-original'); assert(d.querySelectorAll('.original-outlines path').length === 1);
  await click('#show-hidden-outlines'); assert(!$(outline(1)));
  await click('#show-hidden-outlines'); assert($(outline(1)));
});
await check('Hide/show and bulk actions undo and redo as single steps', async () => {
  await click('#undo'); assert($('#visible-outline-1').checked && cuts() === originalCuts);
  await click('#redo'); assert(!$('#visible-outline-1').checked);
  await click('#show-outlines'); assert(cuts() === originalCuts);
  await click('#keep-only-outlines'); assert(!$('#visible-outline-0').checked && $('#visible-outline-1').checked);
  await click('#undo'); assert(cuts() === originalCuts);
  await click('#select-outline-0'); await click('#select-outline-1', true); await click('#hide-outlines');
  assert($('#download').disabled && !$('#outlines-empty').hidden && $('#edit-tabs').disabled);
  assert(cuts() === '' && d.querySelectorAll('.visibility-outline.is-hidden').length === 2);
  await click('#undo'); assert(cuts() === originalCuts && !$('#download').disabled);
});
await check('Tab mode excludes hidden outlines and contains its hint with a caret', async () => {
  await click('#select-outline-0'); await click('#hide-outlines'); await click('#edit-tabs');
  assert($('#outline-inspector').hidden && !$('#tab-inspector').hidden);
  assert($('#edit-outlines').getAttribute('aria-pressed') === 'false');
  assert($('#edit-hint').parentElement === $('#tab-inspector'));
  assert($('#edit-hint').textContent.includes('Drag a tab along its layer'));
  assert($('#outline-picker').options.length === 1 && $('#outline-picker').value === 'outline-1');
  assert($('#outline-picker').textContent.includes('Layer 2'), 'Outline numbering changed');
  assert(markers().length === 4 && markers().every(m => m.dataset.outline === 'outline-1'));
  caretPointsTo('#tab-inspector', '#edit-tabs');
  await click('#add-tab');
  const hiddenGuide = d.querySelector('.outline-hit-targets [data-outline="outline-0"]');
  assert(!hiddenGuide, 'A hidden outline can still accept tabs');
  await click('#add-tab');
});
await check('Custom tab layouts survive hiding and showing their outline', async () => {
  await change('#tab-picker', 'auto-0'); await change('#selected-tab-width', 6); await change('#selected-tab-position', 32);
  customCuts = cuts(); flush(); customLayout = JSON.parse(localStorage.getItem(key)).document.tabLayouts['outline-1'];
  await click('#edit-outlines'); await click('#select-outline-1'); await click('#hide-outlines');
  assert($('#download').disabled);
  await click('#show-outlines'); assert(cuts() === customCuts);
  await click('#edit-tabs'); await change('#tab-picker', 'auto-0');
  assert($('#selected-tab-width').value === '6' && $('#selected-tab-position').value === '32');
});
await check('Hidden outlines are absent from the actual downloaded SVG', async () => {
  let blob;
  const create = w.URL.createObjectURL, anchorClick = w.HTMLAnchorElement.prototype.click;
  w.URL.createObjectURL = value => { blob = value; return 'blob:outline-test'; };
  w.HTMLAnchorElement.prototype.click = function() {};
  try {
    await click('#download');
    const svg = new w.DOMParser().parseFromString(await blob.text(), 'image/svg+xml');
    assert(svg.querySelector('path').getAttribute('d') === cuts());
    assert(svg.documentElement.getAttribute('width') === '166mm');
    assert(svg.querySelectorAll('path').length === 1 && !svg.querySelector('[data-visibility-outline]'));
  } finally { w.URL.createObjectURL = create; w.HTMLAnchorElement.prototype.click = anchorClick; }
});
await check('Visibility and outline editing UI persist across reload with undo history', async () => {
  await click('#edit-outlines'); await click('#show-hidden-outlines'); flush();
  await load(() => w.location.reload());
  assert(!$('#visible-outline-0').checked && $('#visible-outline-1').checked);
  assert(!$('#outline-inspector').hidden && !$('#show-hidden-outlines').checked);
  assert(selected().length === 1 && $('#select-outline-1').getAttribute('aria-pressed') === 'true');
  assert(cuts() === customCuts);
  flush(); assert(JSON.stringify(JSON.parse(localStorage.getItem(key)).document.tabLayouts['outline-1']) === JSON.stringify(customLayout));
  await click('#undo'); assert($('#download').disabled, 'Undo history did not survive reload');
  await click('#redo'); assert(cuts() === customCuts);
});
await check('Settings resets preserve visibility and new artwork starts entirely visible', async () => {
  await change('#artworkWidth', 180); assert(!$('#visible-outline-0').checked);
  await click('#reset'); assert(!$('#visible-outline-0').checked && $('#artworkWidth').value === '150');
  await click('[data-example="orbit"]');
  assert($('#outline-count').textContent === '3 of 3 visible' && selected().length === 0);
  assert($('#undo').disabled);
});
await check('Keyboard selection and hiding retain focus and can be restored from the list', async () => {
  await click('#show-hidden-outlines'); // Enable guides if they were off.
  $(outline(0)).focus();
  $(outline(0)).dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  assert(selected().length === 1 && d.activeElement.dataset.visibilityOutline === 'outline-0');
  $(outline(1)).dispatchEvent(new w.KeyboardEvent('keydown', { key: ' ', shiftKey: true, bubbles: true }));
  assert(selected().length === 2);
  $(outline(1)).dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Delete', bubbles: true }));
  assert(!$('#visible-outline-0').checked && !$('#visible-outline-1').checked);
  await click('#show-hidden-outlines');
  $('#select-outline-2').focus();
  $('#select-outline-2').dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Backspace', bubbles: true }));
  assert($('#download').disabled && d.activeElement.id === 'select-outline-2');
  await click('#show-all-outlines'); assert($('#outline-count').textContent === '3 of 3 visible');
});
await check('Compound transformed paths and open outlines remain independently hideable', async () => {
  const source = '<svg xmlns="http://www.w3.org/2000/svg"><g transform="translate(20 30) scale(2)"><path d="M0 0H100V100H0ZM25 25H75V75H25Z"/><path d="M0 120H100"/></g></svg>';
  const transfer = new w.DataTransfer(); transfer.items.add(new w.File([source], 'compound.svg', { type: 'image/svg+xml' }));
  $('#file-input').files = transfer.files; $('#file-input').dispatchEvent(new w.Event('change'));
  for (let i = 0; i < 50 && $('#filename').textContent !== 'compound.svg'; i++) await sleep(20);
  await click('#use-all-outlines');
  assert(d.querySelectorAll('.outline-row').length === 3);
  const before = [$('#dimension-width').textContent, $('#dimension-height').textContent];
  await click('#visible-outline-1'); await click('#visible-outline-2');
  assert($('#outline-count').textContent === '1 of 3 visible');
  assert(JSON.stringify(before) === JSON.stringify([$('#dimension-width').textContent, $('#dimension-height').textContent]));
  assert(!$('#notice').textContent.includes('Open paths') || $('#notice').hidden);
});
await check('Mobile and tablet panels fit, keep canvas size and point to their active buttons', async () => {
  for (const width of [390, 860]) {
    frame.style.width = `${width}px`;
    // Commit the embedded viewport size before waiting for its resize events.
    frame.getBoundingClientRect();
    await sleep(80);
    // Start each viewport with restored editing state. Virtual-time headless
    // Chrome can defer ResizeObserver delivery in an embedded frame.
    flush(); await load(() => w.location.reload());
    assert(d.documentElement.scrollWidth <= width, `Overflow at ${width}px`);
    caretPointsTo('#outline-inspector', '#edit-outlines');
    const size = $('#preview-svg').getBoundingClientRect();
    const row = $('.outline-row').getBoundingClientRect(), panel = $('#outline-inspector').getBoundingClientRect();
    assert(row.right <= panel.right, 'Outline row overflows panel');
    await click('#edit-tabs'); caretPointsTo('#tab-inspector', '#edit-tabs');
    assert($('#edit-hint').getBoundingClientRect().left >= $('#tab-inspector').getBoundingClientRect().left);
    assert(Math.abs(size.width - $('#preview-svg').getBoundingClientRect().width) < 1, 'Switching modes resized SVG');
    await click('#edit-outlines');
  }
});
await check('Detailed thumbnails preserve corners next to densely sampled sections', async () => {
  const denseTop = Array.from({ length: 1000 }, (_, i) => `L${(i + 1) / 10} 0`).join('');
  const source = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M0 0${denseTop}L100 100L50 100L50 50L0 50Z"/></svg>`;
  const transfer = new w.DataTransfer(); transfer.items.add(new w.File([source], 'detailed.svg', { type: 'image/svg+xml' }));
  $('#file-input').files = transfer.files; $('#file-input').dispatchEvent(new w.Event('change'));
  for (let i = 0; i < 50 && $('#filename').textContent !== 'detailed.svg'; i++) await sleep(20);
  await click('#use-all-outlines');
  const thumbnail = $('.outline-select svg path');
  assert(thumbnail, 'Thumbnail missing');
  const length = thumbnail.getTotalLength();
  const samples = Array.from({ length: 2001 }, (_, i) => thumbnail.getPointAtLength(length * i / 2000));
  for (const [x, y] of [[100, 100], [50, 100], [50, 50]]) {
    assert(samples.some(p => Math.hypot(p.x - x, p.y - y) < 0.5), `Thumbnail skipped corner ${x}, ${y}`);
  }
});
await check('Cut Away treatment removes width and tabs, supports undo, and restores custom layouts', async () => {
  frame.style.width = '1100px'; await sleep(80);
  await click('#edit-tabs'); await change('#tab-picker', 'auto-0'); await change('#selected-tab-width', 7);
  const channels = cuts(); flush();
  const layout = JSON.parse(localStorage.getItem(key)).document.tabLayouts['outline-0'];
  await click('#edit-outlines'); await change('#treatment-outline-0', $('#treatment-outline-0').value === 'cut' ? 'outline' : 'cut');
  assert($('#treatment-outline-0').value === 'cut' && cuts() !== channels);
  assert((cuts().match(/Z/g) || []).length === 1, 'Cut-away must have one boundary');
  assert($('#edit-tabs').disabled && !$('#download').disabled, 'All-cut-away artwork remains downloadable');
  const cutaway = cuts();
  await click('#undo'); assert($('#treatment-outline-0').value === 'outline' && cuts() === channels);
  await click('#redo'); assert($('#treatment-outline-0').value === 'cut' && cuts() === cutaway);
  await click('#visible-outline-0'); assert(cuts() === '' && $('#download').disabled);
  await click('#visible-outline-0'); assert(cuts() === cutaway);
  await change('#treatment-outline-0', $('#treatment-outline-0').value === 'cut' ? 'outline' : 'cut'); assert(cuts() === channels);
  await click('#edit-tabs'); await change('#tab-picker', 'auto-0');
  assert($('#selected-tab-width').value === '7'); flush();
  assert(JSON.stringify(JSON.parse(localStorage.getItem(key)).document.tabLayouts['outline-0']) === JSON.stringify(layout));
  await click('#edit-outlines'); await change('#treatment-outline-0', $('#treatment-outline-0').value === 'cut' ? 'outline' : 'cut');
});
await check('Cut-away boundary and session export survive reload with undo history', async () => {
  const before = cuts(); flush();
  await load(() => w.location.reload());
  assert($('#treatment-outline-0').value === 'cut' && cuts() === before);
  await click('#undo'); assert($('#treatment-outline-0').value === 'outline');
  await click('#redo'); assert($('#treatment-outline-0').value === 'cut' && cuts() === before);
  let blob;
  const create = w.URL.createObjectURL, anchorClick = w.HTMLAnchorElement.prototype.click;
  w.URL.createObjectURL = value => { blob = value; return 'blob:cutaway-test'; };
  w.HTMLAnchorElement.prototype.click = function() {};
  try {
    await click('#download');
    const svg = new w.DOMParser().parseFromString(await blob.text(), 'image/svg+xml');
    assert(svg.querySelector('path').getAttribute('d') === before);
    assert((before.match(/Z/g) || []).length === 1);
    await click('#export-session');
    const session = JSON.parse(await blob.text());
    assert(session.document.materialTreatments['shape-0'] === 'cut');
    assert(session.history.past.some(doc => doc.cutawayContours.length === 0));
  } finally { w.URL.createObjectURL = create; w.HTMLAnchorElement.prototype.click = anchorClick; }
  await change('#channelWidth', 10); assert(cuts() === before, 'Channel width changed the full cut-away');
  await click('#reset'); assert($('#treatment-outline-0').value === 'cut');
});
await check('Open outlines keep channels, cut-aways stay out of tab editing, and rows fit mobile', async () => {
  const source = '<svg xmlns="http://www.w3.org/2000/svg"><path d="M0 0H100V100H0Z"/><path d="M0 120H100"/></svg>';
  const transfer = new w.DataTransfer(); transfer.items.add(new w.File([source], 'cutaway.svg', { type: 'image/svg+xml' }));
  $('#file-input').files = transfer.files; $('#file-input').dispatchEvent(new w.Event('change'));
  for (let i = 0; i < 50 && $('#filename').textContent !== 'cutaway.svg'; i++) await sleep(20);
  assert($('#treatment-outline-0').value === 'cut' && [...$('#treatment-outline-1').options].filter(o => ['keep', 'cut'].includes(o.value)).every(o => o.disabled));
  await click('#edit-tabs');
  assert($('#outline-picker').options.length === 1 && $('#outline-picker').value === 'outline-1');
  assert(!d.querySelector('.outline-hit-targets [data-outline="outline-0"]'));
  assert(markers().every(m => m.dataset.outline === 'outline-1'));
  await click('#edit-outlines');
  for (const width of [390, 860]) {
    frame.style.width = `${width}px`; frame.getBoundingClientRect(); await sleep(80);
    assert(d.documentElement.scrollWidth <= width, `Overflow at ${width}px`);
    const row = $('.outline-row').getBoundingClientRect();
    for (const control of $('.outline-row').querySelectorAll('button, label')) {
      const bounds = control.getBoundingClientRect();
      assert(bounds.left >= row.left && bounds.right <= row.right + 1, `Control overflows outline row at ${width}px`);
    }
  }
});
const failures = document.querySelectorAll('.fail').length;
document.querySelector('#summary').textContent = `${document.querySelectorAll('li:not(.fail)').length} passed; ${failures} failed.`;
</script></html>
