function assert(value, message = 'Unexpected result') { if (!value) throw new Error(message); }
async function check(name, action) {
  const li = document.createElement('li');
  try { await action(); li.textContent = `PASS — ${name}`; }
  catch (error) { li.textContent = `FAIL — ${name}: ${error.message}`; li.className = 'fail'; }
  document.querySelector('#results').append(li);
}
async function load(action) {
  await new Promise(resolve => { frame.addEventListener('load', resolve, { once: true }); action(); });
  d = frame.contentDocument; w = frame.contentWindow;
  if (new URLSearchParams(location.search).has('headless')) {
    w.requestAnimationFrame = callback => w.setTimeout(() => callback(w.performance.now()), 16);
    w.cancelAnimationFrame = id => w.clearTimeout(id);
  }
  await sleep(50);
}
async function click(selector, shiftKey = false) {
  $(selector).dispatchEvent(new w.MouseEvent('click', { bubbles: true, shiftKey })); await sleep(40);

async function change(selector, value) { $(selector).value = value; $(selector).dispatchEvent(new w.Event('change', { bubbles: true })); await sleep(40); }

function caretPointsTo(panelId, buttonId) {

await check('Rectangle selection batches pointer moves and preserves geometry and layer elements', async () => {
  const svg = $('#preview-svg'), bounds = svg.getBoundingClientRect();
  const cut = $('.cut-shape'), target = $(outline(0)), card = $('.layer-card');
  const execute = w.ClipperLib.Clipper.prototype.Execute;
  const request = w.requestAnimationFrame, cancel = w.cancelAnimationFrame;
  const frames = new Map(); let serial = 0, geometryCalls = 0;
  const pointer = (type, x, y) => svg.dispatchEvent(new w.PointerEvent(type, { bubbles: true, pointerId: 43, button: 0, clientX: x, clientY: y }));
  w.ClipperLib.Clipper.prototype.Execute = function(...args) { geometryCalls++; return execute.apply(this, args); };
  w.requestAnimationFrame = callback => { frames.set(++serial, callback); return serial; };
  w.cancelAnimationFrame = id => frames.delete(id);
  const paint = () => { const callbacks = [...frames.values()]; frames.clear(); for (const callback of callbacks) callback(w.performance.now()); };
  try {
    pointer('pointerdown', bounds.left + 1, bounds.top + 1);
    pointer('pointermove', bounds.left + 8, bounds.top + 8);
    pointer('pointermove', bounds.right - 1, bounds.bottom - 1);
    assert(frames.size === 1, 'Pointer moves were not coalesced');
    paint();
    assert(selected().length === 2, 'Frame did not use the latest pointer position');
    const rectangle = $('#tab-selection-box');
    pointer('pointermove', bounds.right - 2, bounds.bottom - 2); paint();
    assert($('#tab-selection-box') === rectangle, 'Selection rectangle was replaced');
    assert($('.cut-shape') === cut && $(outline(0)) === target, 'Canvas geometry was replaced');
    assert($('.layer-card') === card, 'Layer sidebar was rebuilt');
    // Releasing before the next frame must commit the final pointer position.
    pointer('pointermove', bounds.right - 1, bounds.bottom - 1);
    pointer('pointerup', bounds.left + 8, bounds.top + 8);
    assert(selected().length === 0 && !$('#tab-selection-box'), 'Quick release used stale selection');
    assert(frames.size === 0, 'Selection frame survived release');
    pointer('pointerdown', bounds.left + 1, bounds.top + 1);
    pointer('pointermove', bounds.right - 1, bounds.bottom - 1);
    paint();
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    assert(selected().length === 0 && frames.size === 0 && !$('#tab-selection-box'), 'Escape did not cancel selection');
    assert(geometryCalls === 0, 'Selection recalculated stencil geometry');
    assert($('.cut-shape') === cut, 'Cancellation replaced geometry');
  } finally {
    pointer('pointercancel', bounds.left, bounds.top);
    w.ClipperLib.Clipper.prototype.Execute = execute;
    w.requestAnimationFrame = request; w.cancelAnimationFrame = cancel;
  }
});
await check('Rectangle selection changes several layer types with a single undo', async () => {
  const svg = $('#preview-svg'), bounds = svg.getBoundingClientRect();
  const pointer = (type, x, y, target = svg, extra = {}) => target.dispatchEvent(new w.PointerEvent(type, { bubbles: true, pointerId: 42, button: 0, clientX: x, clientY: y, ...extra }));
  pointer('pointerdown', bounds.left + 1, bounds.top + 1);
  pointer('pointermove', bounds.right - 1, bounds.bottom - 1);
  await sleep(25);
  assert($('#tab-selection-box'), 'Selection rectangle missing');
  pointer('pointerup', bounds.right - 1, bounds.bottom - 1);
  svg.dispatchEvent(new w.MouseEvent('click', { bubbles: true, detail: 1 }));
  assert(selected().length === 2, 'Post-drag click cleared selection');
  assert(!$('#selected-layer-treatment').closest('[hidden]'));
  await change('#selected-layer-treatment', 'keep');
  assert([...d.querySelectorAll('[data-treatment-outline]')].every(el => el.value === 'keep'));
  await click('#undo');
  assert([...d.querySelectorAll('[data-treatment-outline]')].every(el => el.value === 'outline'));
  await click('#redo');

  await click('#undo');

  assert($('#selected-layer-treatment').value === '', 'Mixed types not indicated');
  await click('#undo');
  await click('#select-outline-1');
  pointer('pointerdown', bounds.left + 1, bounds.top + 1, svg, { shiftKey: true });
  pointer('pointermove', bounds.left + 8, bounds.top + 8);
  pointer('pointerup', bounds.left + 8, bounds.top + 8);
  assert(selected().length === 1, 'Shift rectangle discarded previous selection');
  // A cancelled drag restores the prior selection.
  await click('#select-outline-1');
  pointer('pointerdown', bounds.left + 1, bounds.top + 1);
  pointer('pointermove', bounds.right - 1, bounds.bottom - 1);
  pointer('pointercancel', bounds.right - 1, bounds.bottom - 1);

await check('Selected filter follows reverse rectangle drags and cancellation', async () => {
  await change('#layer-filter', 'selected');
  const svg = $('#preview-svg'), bounds = svg.getBoundingClientRect(), cut = $('.cut-shape');

await check('Compound transformed paths and open outlines remain independently hideable', async () => {
  const source = '<svg xmlns="http://www.w3.org/2000/svg"><g transform="translate(20 30) scale(2)"><path d="M0 0H100V100H0ZM25 25H75V75H25Z"/><path d="M0 120H100"/></g></svg>';
  const transfer = new w.DataTransfer(); transfer.items.add(new w.File([source], 'compound.svg', { type: 'image/svg+xml' }));
  $('#file-input').files = transfer.files; $('#file-input').dispatchEvent(new w.Event('change'));
  for (let i = 0; i < 50 && $('#filename').textContent !== 'compound.svg'; i++) await sleep(20);
  await click('#use-all-outlines'); await click('#edit-outlines');
  assert(d.querySelectorAll('[data-visible-outline]').length === 3);
  const svg = $('#preview-svg'), inner = $(outline(1)).getBBox(), matrix = svg.getScreenCTM();
  const start = new w.DOMPoint(inner.x - 1, inner.y - 1).matrixTransform(matrix);
  const end = new w.DOMPoint(inner.x + inner.width + 1, inner.y + inner.height + 1).matrixTransform(matrix);
  const pointer = (type, point) => svg.dispatchEvent(new w.PointerEvent(type, { bubbles: true, pointerId: 45, button: 0, clientX: point.x, clientY: point.y }));
  pointer('pointerdown', start); pointer('pointermove', end); pointer('pointerup', end);

  assert($('#select-outline-1').getAttribute('aria-pressed') === 'true' && $('#select-outline-0').getAttribute('aria-pressed') === 'false', 'Compound child selection did not synchronize');

await check('Mobile and tablet panels fit, keep canvas size and identify their active tools', async () => {

});

      const bounds = control.getBoundingClientRect();
      if (!bounds.width && !bounds.height) continue; // Closed reorder menus have no rendered bounds.
      assert(bounds.left >= row.left && bounds.right <= row.right + 1, `Control overflows outline row at ${width}px`);
    }
  }
});
const failures = document.querySelectorAll('.fail').length;
document.querySelector('#summary').textContent = `${document.querySelectorAll('li:not(.fail)').length} passed; ${failures} failed.`;
</script></html>
