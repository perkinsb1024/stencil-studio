<!doctype html><html lang="en"><meta charset="utf-8"><title>Tab editing checks</title>
<style>body{font:14px system-ui;padding:24px;color:#502c6c}li{margin:8px 0}.fail{color:#a00}iframe{width:1100px;height:1500px;border:1px solid #ddd}#summary{font-weight:bold}</style>
<h1>Tab editing checks</h1><p id="summary">Running…</p><ol id="results"></ol><iframe title="Editor under test" src="about:blank"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
localStorage.removeItem('stencil-studio.workspace.v1:tab-editing-tests');
await new Promise(resolve => { frame.addEventListener('load', resolve, { once: true }); frame.src = '/?workspace=tab-editing-tests&live-reload=off'; });
const d = frame.contentDocument, w = frame.contentWindow;
// Virtual-time headless runs may suspend animation frames in an embedded frame.
if (new URLSearchParams(location.search).has('headless')) {
  w.requestAnimationFrame = callback => w.setTimeout(() => callback(w.performance.now()), 16);
  w.cancelAnimationFrame = id => w.clearTimeout(id);
}
const $ = selector => d.querySelector(selector);
const settle = () => new Promise(resolve => w.requestAnimationFrame(() => w.requestAnimationFrame(resolve)));
function assert(value, message = 'Unexpected result') { if (!value) throw new Error(message); }
async function check(name, action) {
  const li = document.createElement('li');
  try { await action(); li.textContent = `PASS — ${name}`; }
  catch (error) { li.textContent = `FAIL — ${name}: ${error.message}`; li.className = 'fail'; }
  document.querySelector('#results').append(li);
}
async function click(selector) { $(selector).click(); await settle(); }
async function change(selector, value) { $(selector).value = value; $(selector).dispatchEvent(new w.Event('change', { bubbles: true })); await settle(); }
async function placeTabOnSelectedOutline() {
  await click('#add-tab');
  const path = [...d.querySelectorAll('.outline-hit-targets path')].find(p => p.dataset.outline === $('#outline-picker').value);
  const p = path.getPointAtLength(path.getTotalLength() * 0.11).matrixTransform($('#preview-svg').getScreenCTM());
  pointer('pointerdown', $('#preview-svg'), p);
  await settle();
  await click('#add-tab');
}
const markers = () => [...d.querySelectorAll('.tab-marker')];
const own = () => markers().filter(m => m.dataset.outline === $('#outline-picker').value);
const point = marker => { const circle = marker.querySelector('circle'); if (circle) return [Number(circle.getAttribute('cx')), Number(circle.getAttribute('cy'))]; const rect = marker.querySelector('rect'); return [Number(rect.getAttribute('x')) + Number(rect.getAttribute('width')) / 2, Number(rect.getAttribute('y')) + Number(rect.getAttribute('height')) / 2]; };
await check('Edit mode exposes selectable tabs, inspector and automatic legend', async () => {
  const before = $('#preview-svg').getBoundingClientRect();
  await click('#edit-tabs'); assert(markers().length === 8); assert(!$('#tab-inspector').hidden);
  const after = $('#preview-svg').getBoundingClientRect();
  assert(Math.abs(before.width - after.width) < 1 && Math.abs(before.height - after.height) < 1, 'Opening tab editing shrank the SVG');
  assert(markers().every(m => m.getAttribute('role') === 'button' && m.getAttribute('tabindex') === '0'));
  assert($('.legend').textContent.includes('Automatic tab') && $('.legend').textContent.includes('Custom tab'));
});
await check('Selected-tab card stays above the canvas without shifting it on selection or clear', async () => {
  const before = $('#canvas-area').getBoundingClientRect();
  const card = $('#tab-inspector').getBoundingClientRect();
  assert(card.bottom <= before.top, 'Editor card is not above the canvas');
  assert(!$('#tab-empty-state').hidden);
  await change('#tab-picker', 'auto-0');
  assert($('#selected-outline-label').textContent === 'Selected tab · Outline 1 · Tab 1');
  assert($('#tab-inspector').classList.contains('has-selection'));
  assert($('#tab-empty-state').hidden);
  assert(Math.abs($('#canvas-area').getBoundingClientRect().top - before.top) < 1, 'Selecting a tab shifted the canvas');
  const area = $('.tab-selection-area').getBoundingClientRect(), controls = $('#selected-tab-controls').getBoundingClientRect();
  assert(controls.bottom <= area.bottom && controls.right <= area.right, 'Selected controls overflow their reserved area');
  await change('#tab-picker', '');
  assert(!$('#tab-empty-state').hidden && $('#selected-tab-controls').hidden);
  assert(Math.abs($('#canvas-area').getBoundingClientRect().top - before.top) < 1, 'Clearing selection shifted the canvas');
});
await check('SVG stays the same size when toggling editing, placement, and outline controls', async () => {
  const baseline = $('#preview-svg').getBoundingClientRect();
  const unchanged = () => {
    const svg = $('#preview-svg').getBoundingClientRect();
    assert(Math.abs(svg.width - baseline.width) < 1 && Math.abs(svg.height - baseline.height) < 1, 'Controls resized the SVG');
    const viewport = $('#canvas-viewport').getBoundingClientRect();
    assert(svg.width <= viewport.width && svg.height <= viewport.height, 'SVG exceeds canvas bounds');
  };
  await click('#add-tab'); unchanged(); await click('#add-tab'); unchanged();
  await change('#outline-picker', 'outline-1'); unchanged();
  await change('#outline-picker', 'outline-0'); unchanged();
  await click('#edit-tabs'); unchanged(); await click('#edit-tabs'); unchanged();
});
await check('Removing an automatic tab freezes only its outline and can be undone/redone', async () => {
  await change('#tab-picker', 'auto-0'); await click('#remove-tab');
  assert(own().length === 3); assert($('#outline-mode').textContent === 'Custom');
  assert($('#automatic-scope').textContent.includes('1 automatic outline'));
  assert(own().every(m => m.querySelector('circle') && !m.querySelector('rect')));
  await click('#undo'); assert(own().length === 4); assert($('#outline-mode').textContent === 'Automatic');
  await click('#redo'); assert(own().length === 3);
});
await check('Global count and offset do not move custom tabs', async () => {
  const before = own().map(point);
  await change('#tabCount', 6); await change('#tabOffset', 37);
  assert(JSON.stringify(own().map(point)) === JSON.stringify(before));
  assert(markers().length === 9);
});
await check('Added tabs inherit width; individual overrides survive default changes', async () => {
  await placeTabOnSelectedOutline(); assert(own().length === 4);
  assert($('#tab-width-status').textContent.includes('Uses default'));
  await change('#selected-tab-width', 5); await change('#tabWidth', 4);
  assert($('#selected-tab-width').value === '5');
  assert(own().filter(m => m.getAttribute('aria-label').includes('4.0 mm')).length === 3);
  await click('#inherit-tab-width'); assert($('#selected-tab-width').value === '4');
});
await check('Selected width slider updates live, stays in sync, and undoes the whole gesture', async () => {
  const id = $('#tab-picker').value, before = $('#selected-tab-width').value;
  for (const value of [5, 6, 7]) {
    $('#selected-tab-width-range').value = value;
    $('#selected-tab-width-range').dispatchEvent(new w.Event('input')); await settle();
    assert(Number($('#selected-tab-width').value) === value);
    assert(own().find(m => m.dataset.tab === id).getAttribute('aria-label').includes(`${value.toFixed(1)} mm`));
  }
  $('#selected-tab-width-range').dispatchEvent(new w.Event('change')); await settle();
  assert($('#tabWidth').value === before, 'Global width changed');
  await click('#undo'); await change('#tab-picker', id);
  assert($('#selected-tab-width').value === before && $('#selected-tab-width-range').value === before);
  assert($('#tab-width-status').textContent.includes('Uses default'), 'Width inheritance was not restored');
  await click('#redo'); await change('#tab-picker', id); assert($('#selected-tab-width-range').value === '7');
  await click('#inherit-tab-width'); assert($('#selected-tab-width-range').value === before);
  await change('#selected-tab-width', 4.8); assert($('#selected-tab-width-range').value === '4.8');
  await click('#inherit-tab-width');
});
await check('Selected position slider moves only its tab and undoes the whole gesture', async () => {
  const id = $('#tab-picker').value, before = Number($('#selected-tab-position').value);
  const otherPoints = own().filter(m => m.dataset.tab !== id).map(point);
  for (const value of [20, 25, 30]) {
    $('#selected-tab-position-range').value = value;
    $('#selected-tab-position-range').dispatchEvent(new w.Event('input')); await settle();
    assert(Number($('#selected-tab-position').value) === value);
  }
  $('#selected-tab-position-range').dispatchEvent(new w.Event('change')); await settle();
  assert(JSON.stringify(own().filter(m => m.dataset.tab !== id).map(point)) === JSON.stringify(otherPoints));
  await click('#undo'); await change('#tab-picker', id);
  assert(Math.abs(Number($('#selected-tab-position').value) - before) < 0.01);
  await click('#redo'); await change('#tab-picker', id); assert($('#selected-tab-position-range').value === '30');
  await change('#selected-tab-position', 34.5); assert($('#selected-tab-position-range').value === '34.5');
});
await check('Numeric position changes only the selected tab and undo restores it', async () => {
  const id = $('#tab-picker').value, before = point(own().find(m => m.dataset.tab === id));
  await change('#selected-tab-position', 23);
  assert(Math.abs(Number($('#selected-tab-position').value) - 23) < 0.01);
  await click('#undo'); const restored = own().find(m => m.dataset.tab === id);
  assert(JSON.stringify(point(restored)) === JSON.stringify(before));
});
await check('Add mode keeps placing tabs across outlines until cancelled, with readable active styling', async () => {
  const before = markers().length;
  await click('#add-tab');
  const active = w.getComputedStyle($('#add-tab'));
  assert(active.color === 'rgb(255, 255, 255)' && active.backgroundColor === 'rgb(80, 44, 108)', 'Active button text has insufficient contrast');
  for (const [index, fraction] of [[0, 0.31], [0, 0.44], [1, 0.62]]) {
    const path = d.querySelectorAll('.outline-hit-targets path')[index];
    const p = path.getPointAtLength(path.getTotalLength() * fraction).matrixTransform($('#preview-svg').getScreenCTM());
    pointer('pointermove', $('#preview-svg'), p); assert($('#tab-ghost'));
    pointer('pointerdown', $('#preview-svg'), p); await settle();
    assert($('#add-tab').getAttribute('aria-pressed') === 'true' && $('#add-tab').textContent === 'Done adding');
    assert($('#tab-ghost'), 'Placement preview disappeared after adding a tab');
  }
  assert(markers().length === before + 3);
  await click('#undo');
  assert(markers().length === before + 2 && $('#add-tab').getAttribute('aria-pressed') === 'true', 'Undo should remove only the last placement and keep add mode active');
  await click('#redo');
  assert(markers().length === before + 3 && $('#add-tab').getAttribute('aria-pressed') === 'true');
  await click('#add-tab');
  assert($('#add-tab').getAttribute('aria-pressed') === 'false' && !$('#tab-ghost'));
  await click('#undo'); assert(markers().length === before + 2, 'Undo should remove only the last placement');
  await click('#redo'); assert(markers().length === before + 3);
});
await check('Escape stops adding from a form field and removes the placement preview', async () => {
  await click('#add-tab');
  const path = $('.outline-hit-targets path');
  const p = path.getPointAtLength(path.getTotalLength() * 0.21).matrixTransform($('#preview-svg').getScreenCTM());
  pointer('pointermove', $('#preview-svg'), p); assert($('#tab-ghost'));
  const before = markers().length;
  $('#selected-tab-width').focus();
  $('#selected-tab-width').dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true })); await settle();
  assert($('#add-tab').getAttribute('aria-pressed') === 'false' && !$('#tab-ghost'));
  assert(!$('#preview-svg').classList.contains('adding-tab') && markers().length === before);
});
await check('Slider changes undo as one action', async () => {
  const before = $('#tabWidth').value;
  for (const value of [6, 7, 8]) { $('#tabWidth-range').value = value; $('#tabWidth-range').dispatchEvent(new w.Event('input')); await settle(); }
  $('#tabWidth-range').dispatchEvent(new w.Event('change')); await settle();
  await click('#undo'); assert($('#tabWidth').value === before);
  await click('#redo'); assert($('#tabWidth').value === '8');
});
await check('Artwork resizing keeps custom widths and proportional positions', async () => {
  const selectedId = $('#tab-picker').value;
  await change('#tab-picker', selectedId || own()[0].dataset.tab);
  const position = $('#selected-tab-position').value;
  await change('#selected-tab-width', 5); await change('#artworkWidth', 220);
  assert($('#selected-tab-width').value === '5'); assert($('#selected-tab-position').value === position);
});
await check('Keyboard selection and movement preserve focus', async () => {
  let marker = own()[0];
  const id = marker.dataset.tab;
  marker.focus(); marker.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); await settle();
  assert($('#tab-picker').value === id); assert(d.activeElement.dataset.tab === id);
  const before = Number($('#selected-tab-position').value);
  d.activeElement.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true })); await settle();
  assert(Math.abs(Number($('#selected-tab-position').value) - before - 0.1) < 0.02); assert(d.activeElement.dataset.tab === id);
});
await check('A custom outline can have zero tabs; reset restores automatic layout and can be undone', async () => {
  while (own().length) { await change('#tab-picker', own()[0].dataset.tab); await click('#remove-tab'); }
  assert($('#notice').textContent.includes('no tabs')); assert($('.cut-shape').getAttribute('d'));
  await click('#reset-outline'); assert(own().length > 0); assert($('#outline-mode').textContent === 'Automatic');
  await click('#undo'); assert(own().length === 0); assert($('#outline-mode').textContent === 'Custom');
});
await check('Automatic controls disable when every outline is custom, and reset-all is undoable', async () => {
  await change('#outline-picker', 'outline-1'); await placeTabOnSelectedOutline();
  assert($('#tabCount').disabled && $('#tabOffset').disabled);
  await click('#reset-all-tabs'); assert(!$('#tabCount').disabled); assert($('#reset-all-tabs').disabled);
  await click('#undo'); assert($('#tabCount').disabled); assert(!$('#reset-all-tabs').disabled);
});
await check('Changing the artwork clears edits and history without reusing outline edits', async () => {
  await click('[data-example="orbit"]'); assert(markers().length === 18); assert($('#undo').disabled && $('#redo').disabled);
  assert($('#automatic-scope').textContent.includes('3 automatic outlines'));
});
await check('Preview highlights never enter the exported cut SVG', async () => {
  let exported;
  const original = w.URL.createObjectURL;
  w.URL.createObjectURL = blob => { exported = blob; return 'blob:tab-edit-test'; };
  const anchorClick = w.HTMLAnchorElement.prototype.click;
  w.HTMLAnchorElement.prototype.click = function () {};
  try { await click('#download'); } finally { w.URL.createObjectURL = original; w.HTMLAnchorElement.prototype.click = anchorClick; }
  const text = await exported.text(); assert(text.includes('width="236mm"'));
  assert(!text.includes('tab-marker') && !text.includes('#258477') && !text.includes('#c3963e'));
  assert(text.includes('fill-rule="evenodd"'));
});
// Exercise pointer gestures against the same SVG handlers used by real input.
function pointer(type, target, p, extra = {}) {
  target.dispatchEvent(new w.PointerEvent(type, { pointerId: 7, clientX: p.x, clientY: p.y, button: 0, bubbles: true, ...extra }));
}
function screenPoint(x, y) { return new w.DOMPoint(x, y).matrixTransform($('#preview-svg').getScreenCTM()); }
function selectAllTabs(allOutlines = true) {
  $(allOutlines ? '#all-layers' : '#selected-layer-only').click();
  const svg = $('#preview-svg'), box = svg.viewBox.baseVal;
  pointer('pointerdown', svg, screenPoint(1, 1));
  pointer('pointermove', svg, screenPoint(box.width - 1, box.height - 1));
  assert($('#tab-selection-box'), 'Selection rectangle did not appear');
  pointer('pointerup', svg, screenPoint(box.width - 1, box.height - 1));
  assert(!$('#tab-selection-box'), 'Selection rectangle remained after release');
}
await check('Dragging a tab follows its own path, syncs sliders, and undoes once', async () => {
  await click('[data-example="bloom"]');
  await change('#tab-picker', 'auto-0');
  const marker = own()[0], before = point(marker);
  const path = [...d.querySelectorAll('.outline-hit-targets path')].find(p => p.dataset.outline === marker.dataset.outline);
  const target = path.getPointAtLength(path.getTotalLength() * 0.36);
  pointer('pointerdown', marker, screenPoint(...before));
  pointer('pointermove', $('#preview-svg'), screenPoint(target.x, target.y));
  assert(Math.abs(Number($('#selected-tab-position').value) - 36) < 0.02);
  assert($('#selected-tab-position-range').value === $('#selected-tab-position').value);
  pointer('pointerup', $('#preview-svg'), screenPoint(target.x, target.y));
  await click('#undo'); assert(JSON.stringify(point(own()[0])) === JSON.stringify(before));
  await click('#redo'); await change('#tab-picker', 'auto-0');
  assert(Math.abs(Number($('#selected-tab-position').value) - 36) < 0.02);
});
await check('Rectangle selection defaults to the outline chosen before dragging', async () => {
  assert($('#selected-layer-only').checked && !$('#all-layers').checked, 'Selected layer only should default on');
  await change('#outline-picker', 'outline-1');
  const pathOnOtherOutline = [...d.querySelectorAll('.outline-hit-targets path')].find(p => p.dataset.outline === 'outline-0');
  const svg = $('#preview-svg'), box = svg.viewBox.baseVal;
  // Start over another outline's hit target; the pre-drag picker still sets scope.
  pointer('pointerdown', pathOnOtherOutline, screenPoint(1, 1));
  pointer('pointermove', svg, screenPoint(box.width - 1, box.height - 1));
  pointer('pointerup', svg, screenPoint(box.width - 1, box.height - 1));
  assert($('#outline-picker').value === 'outline-1');
  assert(own().every(m => m.getAttribute('aria-pressed') === 'true'));
  assert(markers().filter(m => m.dataset.outline !== 'outline-1').every(m => m.getAttribute('aria-pressed') === 'false'));
  const otherLabels = markers().filter(m => m.dataset.outline !== 'outline-1').map(m => m.getAttribute('aria-label'));
  await change('#selected-tab-width', 6);
  assert(own().every(m => m.getAttribute('aria-label').includes('6.0 mm')));
  assert(JSON.stringify(markers().filter(m => m.dataset.outline !== 'outline-1').map(m => m.getAttribute('aria-label'))) === JSON.stringify(otherLabels));
  await click('#undo');
});
await check('Rectangle selection spans outlines and sets a shared width with one undo', async () => {
  selectAllTabs();
  assert(markers().every(m => m.getAttribute('aria-pressed') === 'true'));
  assert($('#selected-outline-label').textContent === `${markers().length} tabs selected`);
  await change('#selected-tab-width', 5);
  assert(markers().every(m => m.getAttribute('aria-label').includes('5.0 mm')));
  await click('#undo'); assert(markers().some(m => !m.getAttribute('aria-label').includes('5.0 mm')));
  await click('#redo'); assert(markers().every(m => m.getAttribute('aria-label').includes('5.0 mm')));
});
await check('Group position slider preserves relative positions across outlines through wraparound', async () => {
  selectAllTabs();
  const paths = [...d.querySelectorAll('.outline-hit-targets path')];
  const before = markers().map(m => {
    const path = paths.find(p => p.dataset.outline === m.dataset.outline), [x, y] = point(m);
    let best = Infinity, fraction = 0;
    for (let i = 0; i < 2000; i++) {
      const p = path.getPointAtLength(path.getTotalLength() * i / 2000), distance = Math.hypot(p.x - x, p.y - y);
      if (distance < best) { best = distance; fraction = i / 2000; }
    }
    return { id: m.dataset.tab, outline: m.dataset.outline, fraction, path };
  });
  const anchor = Number($('#selected-tab-position').value);
  for (const delta of [20, 40, 55]) {
    $('#selected-tab-position-range').value = anchor + delta;
    $('#selected-tab-position-range').dispatchEvent(new w.Event('input')); await settle();
  }
  $('#selected-tab-position-range').dispatchEvent(new w.Event('change')); await settle();
  for (const ref of before) {
    const marker = markers().find(m => m.dataset.tab === ref.id && m.dataset.outline === ref.outline);
    const [x, y] = point(marker), expected = ref.path.getPointAtLength(ref.path.getTotalLength() * ((ref.fraction + 0.55) % 1));
    assert(Math.hypot(x - expected.x, y - expected.y) < 0.2, 'Group spacing changed');
  }
  await click('#undo');
  for (const ref of before) {
    const [x, y] = point(markers().find(m => m.dataset.tab === ref.id && m.dataset.outline === ref.outline));
    const expected = ref.path.getPointAtLength(ref.path.getTotalLength() * ref.fraction);
    assert(Math.hypot(x - expected.x, y - expected.y) < 0.2, 'Undo did not restore group');
  }
});
await check('Cancelled dragging restores layout and removes the rectangle', async () => {
  selectAllTabs();
  const before = markers().map(point), marker = markers()[0];
  pointer('pointerdown', marker, screenPoint(...point(marker)));
  pointer('pointermove', $('#preview-svg'), screenPoint(40, 40));
  pointer('pointercancel', $('#preview-svg'), screenPoint(40, 40));
  assert(JSON.stringify(markers().map(point)) === JSON.stringify(before));
  const svg = $('#preview-svg');
  pointer('pointerdown', svg, screenPoint(1, 1));
  pointer('pointermove', svg, screenPoint(100, 100));
  pointer('pointercancel', svg, screenPoint(100, 100));
  assert(!$('#tab-selection-box'));
});
await check('Dragging a selected group moves every tab and undoes in one step', async () => {
  selectAllTabs();
  const marker = markers()[0], before = markers().map(point);
  const startPosition = Number($('#selected-tab-position').value) / 100;
  const path = [...d.querySelectorAll('.outline-hit-targets path')].find(p => p.dataset.outline === marker.dataset.outline);
  const target = path.getPointAtLength(path.getTotalLength() * ((startPosition + 0.07) % 1));
  pointer('pointerdown', marker, screenPoint(...point(marker)));
  pointer('pointermove', $('#preview-svg'), screenPoint(target.x, target.y));
  pointer('pointerup', $('#preview-svg'), screenPoint(target.x, target.y));
  assert(markers().every((m, i) => Math.hypot(point(m)[0] - before[i][0], point(m)[1] - before[i][1]) > 1), 'Some selected tabs stayed still');
  await click('#undo'); assert(JSON.stringify(markers().map(point)) === JSON.stringify(before));
});
await check('Open-path group position stops at the endpoint without collapsing spacing', async () => {
  const file = new w.File(['<svg xmlns="http://www.w3.org/2000/svg"><path d="M0 0L100 50"/></svg>'], 'open-group.svg', { type: 'image/svg+xml' });
  const transfer = new w.DataTransfer(); transfer.items.add(file);
  $('#file-input').files = transfer.files; $('#file-input').dispatchEvent(new w.Event('change'));
  for (let i = 0; i < 40 && $('#filename').textContent !== 'open-group.svg'; i++) await settle();
  assert($('#filename').textContent === 'open-group.svg', 'Test SVG did not load');
  selectAllTabs();
  const before = markers().map(point);
  await change('#selected-tab-position', 100);
  const after = markers().map(point);
  const dx = after[0][0] - before[0][0], dy = after[0][1] - before[0][1];
  assert(dx > 1);
  assert(after.every((p, i) => Math.abs(p[0] - before[i][0] - dx) < 0.001 && Math.abs(p[1] - before[i][1] - dy) < 0.001), 'Group collapsed at the endpoint');
  const path = $('.outline-hit-targets path'), end = path.getPointAtLength(path.getTotalLength());
  assert(Math.hypot(after.at(-1)[0] - end.x, after.at(-1)[1] - end.y) < 0.001);
});
await check('Delete removes selected tabs after focus leaves the SVG and preserves typing in fields', async () => {
  await change('#tab-picker', markers()[0].dataset.tab);
  const before = markers().length;
  $('#selected-tab-width').focus();
  const typing = new w.KeyboardEvent('keydown', { key: 'Delete', bubbles: true, cancelable: true });
  $('#selected-tab-width').dispatchEvent(typing);
  assert(!typing.defaultPrevented && markers().length === before, 'Delete was intercepted while typing');
  d.body.focus();
  d.body.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Delete', bubbles: true, cancelable: true }));
  assert(markers().length === before - 1, 'Selected tab was not removed without marker focus');
  await click('#undo'); assert(markers().length === before);
  await change('#tab-picker', markers()[0].dataset.tab);
  $('#tab-picker').focus();
  $('#tab-picker').dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Backspace', bubbles: true, cancelable: true }));
  assert(markers().length === before - 1, 'Picker focus prevented deleting the selected tab');
  await click('#undo'); assert(markers().length === before);
  selectAllTabs();
  d.body.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Delete', bubbles: true, cancelable: true }));
  assert(markers().length === 0, 'Delete did not remove the selected group');
  await click('#undo'); assert(markers().length === before);
});
const failures = document.querySelectorAll('.fail').length;
document.querySelector('#summary').textContent = `${document.querySelectorAll('li:not(.fail)').length} passed; ${failures} failed.`;
</script></html>
